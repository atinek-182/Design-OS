<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad_F05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0E12"/>
      <stop offset="50%" stop-color="#151720"/>
      <stop offset="100%" stop-color="#0A0B0E"/>
    </linearGradient>
    <linearGradient id="cardGrad_F05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E202B"/>
      <stop offset="100%" stop-color="#111218"/>
    </linearGradient>
    <linearGradient id="accentGrad_F05" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D001A"/>
      <stop offset="100%" stop-color="#6D001A"/>
    </linearGradient>
    <pattern id="grid_F05" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#232634" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad_F05)"/>
  <rect width="1920" height="1080" fill="url(#grid_F05)"/>

  <!-- Glowing Backdrop Orb -->
  <circle cx="1500" cy="300" r="400" fill="#6D001A" opacity="0.12" filter="blur(80px)"/>

  <!-- Card Frame -->
  <rect x="120" y="100" width="1680" height="880" rx="32" fill="url(#cardGrad_F05)" stroke="#2D3042" stroke-width="2"/>
  
  <!-- Accent Top Border -->
  <rect x="120" y="100" width="1680" height="8" rx="4" fill="url(#accentGrad_F05)"/>

  <!-- Number Watermark -->
  <text x="1700" y="800" font-family="'Havock', 'Inter', sans-serif" font-size="280" font-weight="900" fill="#252838" text-anchor="end" opacity="0.5">F05</text>

  <!-- Tag Pill -->
  <rect x="220" y="200" width="240" height="56" rx="28" fill="#6D001A" opacity="0.9"/>
  <text x="340" y="236" font-family="'Rosehot', 'Inter', sans-serif" font-size="20" font-weight="700" fill="#FAF8F5" text-anchor="middle" letter-spacing="2">MOTION CHEATSHEET</text>

  <!-- Title -->
  <text x="220" y="380" font-family="'Havock', 'Inter', sans-serif" font-size="72" font-weight="800" fill="#FAF8F5">GSAP Animation Cheatsheet</text>
  
  <!-- Subtitle -->
  <text x="220" y="460" font-family="'Rosehot', 'Inter', sans-serif" font-size="32" font-weight="400" fill="#C5A059">ScrollTrigger & Timeline Presets</text>

  <!-- Code Preview Box Illustration -->
  <rect x="220" y="540" width="1000" height="340" rx="16" fill="#0D0E12" stroke="#33374A" stroke-width="2"/>
  <circle cx="260" cy="580" r="8" fill="#D61C2C"/>
  <circle cx="290" cy="580" r="8" fill="#C5A059"/>
  <circle cx="320" cy="580" r="8" fill="#2ECC71"/>
  
  <text x="260" y="650" font-family="monospace" font-size="24" fill="#6D001A">&lt;ZorixelComponent</text>
  <text x="280" y="700" font-family="monospace" font-size="24" fill="#FAF8F5">theme="ObsidianMidnight"</text>
  <text x="280" y="750" font-family="monospace" font-size="24" fill="#C5A059">motion="GSAP.ScrollTrigger"</text>
  <text x="260" y="800" font-family="monospace" font-size="24" fill="#6D001A">/&gt;</text>

  <!-- Zorixel Brand Stamp -->
  <text x="1740" y="920" font-family="'Nuqun', 'Rosehot', sans-serif" font-size="24" font-weight="600" fill="#6D001A" text-anchor="end">ZORIXEL ENGINE</text>
</svg>